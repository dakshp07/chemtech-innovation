  <!-- Growth arrow, drawn BEFORE the helix so the strands occlude the shaft and
       it reads as passing behind the molecule. Its origin sits inside the helix
       envelope so no tail stub protrudes. Breaks out past the upper-right edge;
       a thin darker-green casing separates it from the body. -->
